<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>{{ t('my_profile') }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/artisan.css') }}">
</head>
<body class="app-body">
  <div class="app-shell">

    <header class="top-bar">
      <a href="{{ url_for('artisan_dashboard') }}" class="top-bar-back">← {{ t('back') }}</a>
      <span class="top-bar-title">👤 {{ t('my_profile') }}</span>
      <span class="top-bar-action"></span>
    </header>

    <main class="scroll-main">
      <div class="card profile-card">
        <div class="profile-avatar">👨‍🎨</div>
        <h2 class="profile-name">{{ artisan.name }}</h2>

        <div class="profile-detail-row">
          <span class="profile-detail-label">{{ t('craft_label') }}</span>
          <span class="profile-detail-value">{{ artisan.craft }}</span>
        </div>
        <div class="profile-detail-row">
          <span class="profile-detail-label">{{ t('location_label') }}</span>
          <span class="profile-detail-value">{{ artisan.location }}</span>
        </div>
        <div class="profile-detail-row">
          <span class="profile-detail-label">{{ t('mobile_label') }}</span>
          <span class="profile-detail-value">{{ artisan.mobile }}</span>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">🌐 {{ t('language_label') }}</h2>
        <form method="POST" action="{{ url_for('artisan_profile') }}" class="stacked-form">
          <select name="language" class="form-input">
            <option value="en" {% if current_lang == 'en' %}selected{% endif %}>English</option>
            <option value="mr" {% if current_lang == 'mr' %}selected{% endif %}>मराठी</option>
            <option value="hi" {% if current_lang == 'hi' %}selected{% endif %}>हिंदी</option>
          </select>
          <button type="submit" class="btn btn-primary btn-large">{{ t('save') }}</button>
        </form>
      </div>

      <a href="{{ url_for('artisan_logout') }}" class="btn btn-outline btn-large logout-btn">
        ⎋ {{ t('logout') }}
      </a>
    </main>
  </div>
</body>
</html>
